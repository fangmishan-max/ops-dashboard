<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>每周运营检查工作台</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #16213a;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #c084fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    padding: 22px 28px 28px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  header h1 { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  header .sub { color: var(--muted); font-size: 15px; }
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .kpi .label { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .kpi .value { font-size: 28px; font-weight: 700; }
  .kpi .delta { font-size: 14px; margin-top: 4px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px 18px;
    margin-bottom: 18px;
  }
  section h2 {
    font-size: 20px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section h2 .tag {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2px 10px;
  }
  .note { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hl-red td { background: rgba(248,113,113,.10); }
  tr.hl-yellow td { background: rgba(251,191,36,.08); }
  tr.hl-green td { background: rgba(52,211,153,.08); }
  .up { color: var(--red); }
  .down { color: var(--green); }
  .flat { color: var(--muted); }
  .badge {
    display: inline-block;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 13px;
    font-weight: 500;
  }
  .badge.red { background: rgba(248,113,113,.18); color: var(--red); }
  .badge.yellow { background: rgba(251,191,36,.16); color: var(--yellow); }
  .badge.green { background: rgba(52,211,153,.16); color: var(--green); }
  .badge.blue { background: rgba(96,165,250,.16); color: var(--blue); }
  .cards2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }
  .mini {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .mini h3 { font-size: 15px; margin-bottom: 8px; color: var(--blue); }
  .mini p { font-size: 14px; line-height: 1.7; color: var(--text); }
  .mini .warn { color: var(--red); font-weight: 600; }
  .mini .ok { color: var(--green); font-weight: 600; }
  .flex {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .stat {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat .vs { color: var(--muted); font-size: 13px; margin-top: 3px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .cards2 { grid-template-columns: 1fr; }
    body { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>每周运营检查工作台</h1>
  <div class="sub" id="header-sub"></div>
</header>

<div class="kpis" id="kpis"></div>

<section id="sec-funnel">
  <h2>① 商品排行 · 漏斗分析（7 天）<span class="tag" id="funnel-period"></span></h2>
  <div class="note">口径：访客 → 加购 → 支付，支付率 = 支付件数 ÷ 访客数；带环比较上一周期。</div>
  <div class="table-wrap"><table id="funnel-table"></table></div>
  <div class="cards2" id="funnel-notes"></div>
</section>

<section id="sec-new">
  <h2>② 新品追踪（近两月上架 · 7 天）<span class="tag" id="new-period"></span></h2>
  <div class="flex" id="new-stats"></div>
  <div class="note" style="margin-top:14px">表现突出的新品（按成交/流量）：</div>
  <div class="table-wrap"><table id="new-table"></table></div>
</section>

<section id="sec-pxi">
  <h2>③ 商品体验分（PXI）</h2>
  <div class="flex" id="pxi-stats"></div>
  <div class="cards2" id="pxi-lists"></div>
</section>

<section id="sec-stock">
  <h2>④ 仓储库存</h2>
  <div id="stock-body"></div>
</section>

<section id="sec-content">
  <h2>⑤ 内容监控 · 小红书/抖音爆款（饰品赛道）<span class="tag" id="content-period"></span></h2>
  <div class="note" id="content-note"></div>
  <div id="content-tables"></div>
  <div class="note" style="margin-top:14px">小红书笔记在电脑浏览器打不开时，用小红书 App「扫一扫」扫表格中“二维码”列即可查看。</div>
  <div id="content-topic-suggestions"></div>
  <div id="content-extra-tables"></div>
</section>

<footer>由每周一 14:00 定时任务自动更新 · 页面每 5 分钟自动刷新 · 生成于 <span id="gen-time"></span></footer>

function renderBoomTable(host, t) {
  const rows = t.rows || [];
  const box = document.createElement("div");
  box.className = "mini";
  box.style.marginTop = "12px";
  const head = `<h3>${esc(t.title)}</h3>`;

    host.appendChild(box);
    return;
  }
  const maxIv = Math.max.apply(null, rows.map(r => Number(r[8]) || 0));
  const ch = ["平台", "标题 / 作者", "二维码", "点赞", "收藏", "评论", "分享", "互动值（百分制）"];

      ? '<span class="badge red">小红书</span>'
      : '<span class="badge blue">抖音</span>';
    const m = String(r[2]).match(/explore\/([0-9a-zA-Z]+)/);
    const qr = m ? (t.qr || []).find(q => q.id === m[1]) : null;
    const iv = Number(r[8]) || 0;
    const score = maxIv > 0 ? Math.round(iv / maxIv * 100) : 0;
    const scoreCls = score >= 80 ? "red" : score >= 50 ? "yellow" : "blue";
    return `<tr>
      <td>${badge}</td>

      <td class="num"><span class="badge ${scoreCls}" style="font-size:14px;font-weight:700">${score}分</span><br><span style="color:var(--muted);font-size:12px">${esc(r[8])}</span></td>
    </tr>`;
  }).join("");
  box.innerHTML = head +
    (t.note ? `<p style="color:var(--muted);margin-top:4px;font-size:13px">${esc(t.note)}</p>` : "") +
    '<div class="table-wrap"><table><thead><tr>' +
    ch.map(h => `<th class="${numCols.has(h) ? "num" : ""}">${esc(h)}</th>`).join("") +
    '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
  host.appendChild(box);
}
